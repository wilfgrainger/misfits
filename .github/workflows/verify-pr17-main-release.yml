name: Verify PR17 main release

on:
  push:
    branches:
      - ops/verify-pr17-main-release
    paths:
      - .github/workflows/verify-pr17-main-release.yml

permissions:
  actions: read
  contents: write

jobs:
  verify-main-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 3185019780f9560917dd22bb9326c342662ba420
      PROD_ORIGIN: https://darts.graingers.agency
    steps:
      - uses: actions/checkout@v4
      - name: Observe main CI and deploy
        shell: bash
        run: |
          set -euo pipefail
          runs_json="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&event=push&per_page=20")"
          run_id="$(jq -r '.workflow_runs[] | select(.name == "CI" and .head_branch == "main") | .id' <<<"$runs_json" | head -n1)"
          [ -n "$run_id" ] && [ "$run_id" != 'null' ]
          run_status="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id and .head_branch == "main") | .status' <<<"$runs_json")"
          run_conclusion="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id and .head_branch == "main") | .conclusion' <<<"$runs_json")"
          run_url="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id and .head_branch == "main") | .html_url' <<<"$runs_json")"
          jobs_json="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")"
          verify="$(jq -r '[.jobs[] | select(.name == "verify")][0].conclusion // "not_found"' <<<"$jobs_json")"
          deploy="$(jq -r '[.jobs[] | select(.name == "Deploy Worker")][0].conclusion // "not_found"' <<<"$jobs_json")"
          verify_url="$(jq -r '[.jobs[] | select(.name == "verify")][0].html_url // ""' <<<"$jobs_json")"
          deploy_url="$(jq -r '[.jobs[] | select(.name == "Deploy Worker")][0].html_url // ""' <<<"$jobs_json")"
          [ "$run_status" = 'completed' ] && [ "$run_conclusion" = 'success' ] && [ "$verify" = 'success' ] && [ "$deploy" = 'success' ]
          mkdir -p docs/operations/evidence
          cat > docs/operations/evidence/2026-08-22-pr17-main-release.md <<EOF
          # PR #17 main release evidence

          - Merge SHA: \`$TARGET_SHA\`
          - Required branch: \`main\`
          - Main CI run: \`$run_id\`
          - Main CI URL: $run_url
          - Main CI status: \`$run_status\`
          - Main CI conclusion: \`$run_conclusion\`
          - \`verify\` conclusion: \`$verify\`
          - Verify job URL: $verify_url
          - \`Deploy Worker\` conclusion: \`$deploy\`
          - Deploy job URL: $deploy_url
          - Recorded UTC: \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`
          EOF
      - name: Diagnose production scoring APIs
        shell: bash
        run: |
          set +e
          mkdir -p docs/operations/evidence
          health_code="$(curl -sS --retry 3 --retry-all-errors --max-time 20 -o /tmp/health.json -w '%{http_code}' "$PROD_ORIGIN/api/health")"
          health_curl=$?
          health_ok=false
          [ "$health_curl" -eq 0 ] && [ "$health_code" = '200' ] && jq -e '.ok == true' /tmp/health.json >/dev/null 2>&1 && health_ok=true

          leagues_code="$(curl -sS --retry 3 --retry-all-errors --max-time 20 -o /tmp/leagues.json -w '%{http_code}' "$PROD_ORIGIN/api/public/leagues")"
          leagues_curl=$?
          leagues_ok=false
          public_count='unknown'
          league_id='not_available'
          scoring_probe='not_checked'
          standings_code='not_checked'
          standings_count='not_checked'
          standings_ok='not_checked'
          results_code='not_checked'
          results_count='not_checked'
          results_ok='not_checked'
          if [ "$leagues_curl" -eq 0 ] && [ "$leagues_code" = '200' ] && jq -e '.leagues | type == "array"' /tmp/leagues.json >/dev/null 2>&1; then
            leagues_ok=true
            public_count="$(jq '.leagues | length' /tmp/leagues.json)"
            if [ "$public_count" -gt 0 ]; then
              if jq -e '.leagues[] | (.maxLegs|type=="number") and (.pointsPerWin|type=="number") and (.pointsPerDraw|type=="number") and (.pointsPerLoss|type=="number") and (.targetLegs|type=="number")' /tmp/leagues.json >/dev/null 2>&1; then
                scoring_probe='passed'
              else
                scoring_probe='failed'
              fi
              league_id="$(jq -r '.leagues[0].id' /tmp/leagues.json)"
              standings_code="$(curl -sS --retry 3 --retry-all-errors --max-time 20 -o /tmp/standings.json -w '%{http_code}' "$PROD_ORIGIN/api/public/leagues/$league_id/standings")"
              if [ "$?" -eq 0 ] && [ "$standings_code" = '200' ] && jq -e '.standings | type == "array"' /tmp/standings.json >/dev/null 2>&1; then
                standings_ok=true
                standings_count="$(jq '.standings | length' /tmp/standings.json)"
                if [ "$standings_count" -gt 0 ]; then
                  jq -e '.standings[] | (.rank|type=="number") and (.drawn|type=="number") and (.legsFor|type=="number") and (.points|type=="number")' /tmp/standings.json >/dev/null 2>&1 || standings_ok=false
                fi
              else
                standings_ok=false
              fi
              results_code="$(curl -sS --retry 3 --retry-all-errors --max-time 20 -o /tmp/results.json -w '%{http_code}' "$PROD_ORIGIN/api/public/leagues/$league_id/results")"
              if [ "$?" -eq 0 ] && [ "$results_code" = '200' ] && jq -e '.results | type == "array"' /tmp/results.json >/dev/null 2>&1; then
                results_ok=true
                results_count="$(jq '.results | length' /tmp/results.json)"
              else
                results_ok=false
              fi
            else
              scoring_probe='not_applicable_no_public_league'
            fi
          fi

          smoke_ok=false
          if [ "$health_ok" = true ] && [ "$leagues_ok" = true ]; then
            if [ "$public_count" = '0' ]; then
              smoke_ok=true
            elif [ "$scoring_probe" = 'passed' ] && [ "$standings_ok" = true ] && [ "$results_ok" = true ]; then
              smoke_ok=true
            fi
          fi

          health_body="$(head -c 500 /tmp/health.json 2>/dev/null | tr '\n' ' ')"
          leagues_body="$(head -c 500 /tmp/leagues.json 2>/dev/null | tr '\n' ' ')"
          cat > docs/operations/evidence/2026-08-22-pr17-production-smoke.md <<EOF
          # PR #17 production smoke evidence

          - Production origin: \`$PROD_ORIGIN\`
          - Health HTTP status: \`$health_code\`
          - Health contract valid: \`$health_ok\`
          - Public leagues HTTP status: \`$leagues_code\`
          - Public leagues contract valid: \`$leagues_ok\`
          - Public league count: \`$public_count\`
          - First public league ID: \`$league_id\`
          - Scoring fields probe: \`$scoring_probe\`
          - Standings HTTP status: \`$standings_code\`
          - Standings contract valid: \`$standings_ok\`
          - Standings rows: \`$standings_count\`
          - Results HTTP status: \`$results_code\`
          - Results contract valid: \`$results_ok\`
          - Results rows: \`$results_count\`
          - Overall smoke: \`$smoke_ok\`
          - Health response prefix: \`$health_body\`
          - Public leagues response prefix: \`$leagues_body\`
          - Recorded UTC: \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`
          EOF
          echo "SMOKE_OK=$smoke_ok" >> "$GITHUB_ENV"
      - name: Commit observer evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/operations/evidence/2026-08-22-pr17-main-release.md docs/operations/evidence/2026-08-22-pr17-production-smoke.md
          git commit -m 'docs: record PR17 release and smoke evidence'
          git push
      - name: Require production smoke success
        run: test "$SMOKE_OK" = 'true'
