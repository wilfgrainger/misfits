name: Verify PR17 main release

on:
  push:
    branches:
      - ops/verify-pr17-main-release
    paths:
      - .github/workflows/verify-pr17-main-release.yml

permissions:
  actions: read
  contents: write

jobs:
  verify-main-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 3185019780f9560917dd22bb9326c342662ba420
    steps:
      - uses: actions/checkout@v4
      - name: Observe main CI and deploy
        shell: bash
        run: |
          set -uo pipefail
          run_id=''
          run_url=''
          run_status='not_found'
          run_conclusion='null'
          verify='not_found'
          deploy='not_found'
          verify_url=''
          deploy_url=''
          observation=''

          for attempt in $(seq 1 90); do
            if ! runs_json="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&event=push&per_page=20" 2>&1)"; then
              observation="GitHub API error while listing runs: $runs_json"
              break
            fi
            run_id="$(jq -r '.workflow_runs[] | select(.name == "CI" and .head_branch == "main") | .id' <<<"$runs_json" | head -n1)"
            if [ -n "$run_id" ] && [ "$run_id" != 'null' ]; then
              run_status="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id and .head_branch == "main") | .status' <<<"$runs_json")"
              run_conclusion="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id and .head_branch == "main") | .conclusion' <<<"$runs_json")"
              run_url="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id and .head_branch == "main") | .html_url' <<<"$runs_json")"
              [ "$run_status" = 'completed' ] && break
            fi
            sleep 5
          done

          if [ -n "$run_id" ] && [ "$run_id" != 'null' ]; then
            if jobs_json="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" 2>&1)"; then
              verify="$(jq -r '[.jobs[] | select(.name == "verify")][0].conclusion // "not_found"' <<<"$jobs_json")"
              deploy="$(jq -r '[.jobs[] | select(.name == "Deploy Worker")][0].conclusion // "not_found"' <<<"$jobs_json")"
              verify_url="$(jq -r '[.jobs[] | select(.name == "verify")][0].html_url // ""' <<<"$jobs_json")"
              deploy_url="$(jq -r '[.jobs[] | select(.name == "Deploy Worker")][0].html_url // ""' <<<"$jobs_json")"
            else
              observation="GitHub API error while listing jobs: $jobs_json"
            fi
          elif [ -z "$observation" ]; then
            observation='No main CI run found for merge SHA within observation window.'
          fi

          mkdir -p docs/operations/evidence
          cat > docs/operations/evidence/2026-08-22-pr17-main-release.md <<EOF
          # PR #17 main release evidence

          - Merge SHA: \`$TARGET_SHA\`
          - Required branch: \`main\`
          - Main CI run: \`${run_id:-not_found}\`
          - Main CI URL: ${run_url:-not_available}
          - Main CI status: \`$run_status\`
          - Main CI conclusion: \`$run_conclusion\`
          - \`verify\` conclusion: \`$verify\`
          - Verify job URL: ${verify_url:-not_available}
          - \`Deploy Worker\` conclusion: \`$deploy\`
          - Deploy job URL: ${deploy_url:-not_available}
          - Observation: ${observation:-Main branch CI and deploy jobs observed.}
          - Recorded UTC: \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`
          EOF

          {
            echo "RUN_CONCLUSION=$run_conclusion"
            echo "VERIFY_CONCLUSION=$verify"
            echo "DEPLOY_CONCLUSION=$deploy"
          } >> "$GITHUB_ENV"
      - name: Commit observer evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/operations/evidence/2026-08-22-pr17-main-release.md
          git commit -m 'docs: record PR17 main release evidence'
          git push
      - name: Require successful main release
        run: |
          test "$RUN_CONCLUSION" = 'success'
          test "$VERIFY_CONCLUSION" = 'success'
          test "$DEPLOY_CONCLUSION" = 'success'
