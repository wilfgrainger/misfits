name: CI

on:
  push:
  pull_request:

jobs:
  align-story-authority:
    if: github.event_name == 'push' && github.ref == 'refs/heads/spec/ux-compression'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec/ux-compression
      - name: Align canonical catalogue authority note
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/superpowers/specs/2026-08-21-user-stories.md')
          text = path.read_text()
          anchor = 'This file is the **master user-story list for Misfits 501**. It owns the functional backlog for administrator, player and deliberately public club behaviour.\n'
          note = '\nStory wording and acceptance criteria live here. **Operational completion state is owned by the latest validation evidence plus the corresponding GitHub issue**, not by an older row label in isolation. A stale catalogue status must not silently reopen or close work; align the row when that story is next touched.\n'
          if note.strip() not in text:
              if anchor not in text:
                  raise SystemExit('authority anchor not found')
              path.write_text(text.replace(anchor, anchor + note, 1))
          PY
          if git diff --quiet -- docs/superpowers/specs/2026-08-21-user-stories.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/specs/2026-08-21-user-stories.md
          git commit -m "docs: clarify story completion authority"
          git push origin HEAD:spec/ux-compression

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler types
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy Worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: misfits-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --keep-vars
