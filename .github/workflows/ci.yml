name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run verification and capture evidence
        id: verify
        shell: bash
        run: |
          set +e
          mkdir -p .ci
          npm run typecheck > .ci/typecheck.log 2>&1
          TYPECHECK=$?
          npm test > .ci/test.log 2>&1
          TESTS=$?
          npm run build > .ci/build.log 2>&1
          BUILD=$?
          {
            echo "commit=${GITHUB_SHA}"
            echo "typecheck=${TYPECHECK}"
            echo "tests=${TESTS}"
            echo "build=${BUILD}"
            echo
            echo "--- typecheck ---"
            tail -120 .ci/typecheck.log
            echo
            echo "--- tests ---"
            tail -160 .ci/test.log
            echo
            echo "--- build ---"
            tail -120 .ci/build.log
          } > .ci/last-run.txt
          RESULT=$(( TYPECHECK || TESTS || BUILD ))
          echo "result=${RESULT}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Print verification evidence
        if: always()
        run: cat .ci/last-run.txt
      - name: Commit verification evidence and lockfile
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .ci/last-run.txt
          git diff --cached --quiet || git commit -m "chore: capture verification evidence [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Fail when verification failed
        if: steps.verify.outputs.result != '0'
        run: exit 1
