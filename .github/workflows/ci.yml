name: CI

on:
  push:
  pull_request:

jobs:
  finalize-release:
    if: github.event_name == 'pull_request' && github.head_ref == 'spec/ux-compression'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec/ux-compression
      - name: Apply final Cave Pony cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing replacement anchor in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once('src/client/components/AdminCompetitionDeskV2.tsx', '  type ResultSummary,\n', '')
          replace_once('src/client/components/AdminCompetitionDeskV2.tsx', '  const [results, setResults] = useState<ResultSummary[]>([]);\n', '')
          replace_once(
              'src/client/components/AdminCompetitionDeskV2.tsx',
              "    if (task === 'results' && selectedLeague) Promise.all([api.adminResults(selectedLeague.id), api.competitionMembers(selectedLeague.id)]).then(([r, m]) => { setResults(r.results); setMembersByLeague((current) => ({ ...current, [selectedLeague.id]: m.members })); }).catch((cause) => setError(describeError(cause, 'Results could not be loaded.')));\n",
              ''
          )

          p = Path('tests/client/player-app.test.tsx')
          text = p.read_text()
          text = text.replace("import { cleanup, fireEvent, render, screen, waitFor, within } from '@testing-library/react';", "import { cleanup, fireEvent, render, screen, waitFor } from '@testing-library/react';", 1)
          text = text.replace("import { AdminLeagueDesk } from '../../src/client/components/AdminLeagueDesk';\n", '', 1)
          start = text.index("\n  it('renders the admin league creation and invite workspace'")
          end = text.index("\n  it('resets the result form when switching to another league'", start)
          text = text[:start] + text[end:]
          p.write_text(text)

          p = Path('tests/client/league-switch-race.test.tsx')
          text = p.read_text().replace("import { AdminLeagueDesk } from '../../src/client/components/AdminLeagueDesk';\n", '', 1)
          start = text.index("\n  it('does not let a previous league response replace the selected admin data'")
          if not text.endswith("\n});\n"):
              raise SystemExit('unexpected league-switch-race ending')
          text = text[:start] + "\n});\n"
          p.write_text(text)

          p = Path('tests/client/weekly-ledger-structure.test.tsx')
          text = p.read_text().replace("import { AdminLeagueDesk } from '../../src/client/components/AdminLeagueDesk';\n", '', 1)
          start = text.index("\n  it('renders all four season admin task controls with one selected tab'")
          if not text.endswith("\n});\n"):
              raise SystemExit('unexpected weekly-ledger ending')
          text = text[:start] + "\n});\n"
          p.write_text(text)

          replace_once(
              'DESIGN.md',
              '- **Account panel**: user name hero at 1.9rem/800 weight, role line below, season count badge.\n',
              '- **Signed-in shell**: the header owns identity; selected season/league context stays compact and close to the working surface.\n'
          )
          replace_once(
              'DESIGN.md',
              '- **Player workspace**: league-heading block gives the season name/status, then a segmented tab row.\n',
              '- **Player workspace**: league-heading block gives season/league context, then a horizontally scrollable 44px content-tab row.\n'
          )
          PY

          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/components/AdminCompetitionDeskV2.tsx tests/client/player-app.test.tsx tests/client/league-switch-race.test.tsx tests/client/weekly-ledger-structure.test.tsx DESIGN.md .github/workflows/ci.yml
          git commit -m "refactor: finish UX compression cleanup"
          git push origin HEAD:spec/ux-compression

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler types
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy Worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: misfits-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --keep-vars
