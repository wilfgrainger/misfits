name: Task 4 scoring integration patch

on:
  push:
    branches:
      - feat/configurable-match-scoring

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[apply-task4]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/configurable-match-scoring
          fetch-depth: 0
      - name: Apply verified Task 4 transformations
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {actual} for {old[:80]!r}')
              p.write_text(text.replace(old, new))

          def replace_any(path, old, new):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < 1:
                  raise SystemExit(f'{path}: expected at least one match for {old[:80]!r}')
              p.write_text(text.replace(old, new))

          # Canonical competition records expose the new persisted scoring fields.
          replace('src/server/db/competition.ts',
              "  points_per_win: number;\n  target_legs: number;",
              "  max_legs: number;\n  points_per_win: number;\n  points_per_draw: number;\n  points_per_loss: number;\n  target_legs: number;")
          replace('src/server/db/competition.ts',
              "`SELECT id, name, slug, season_name, season_id, status, points_per_win, target_legs,\n",
              "`SELECT id, name, slug, season_name, season_id, status, max_legs, points_per_win, points_per_draw, points_per_loss, target_legs,\n",
              2)

          # Season-scoped league writes persist the complete scoring contract.
          replace('src/server/db/competition-leagues.ts',
              "id, name, slug, season_name, season_id, status, points_per_win, target_legs,\n          created_at, updated_at, created_by, max_players, matches_per_pair, visibility,",
              "id, name, slug, season_name, season_id, status, points_per_win, points_per_draw, points_per_loss, max_legs, target_legs,\n          created_at, updated_at, created_by, max_players, matches_per_pair, visibility,")
          replace('src/server/db/competition-leagues.ts',
              ") VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`",
              ") VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`")
          replace('src/server/db/competition-leagues.ts',
              "        input.pointsPerWin,\n        input.targetLegs,",
              "        input.pointsPerWin,\n        input.pointsPerDraw,\n        input.pointsPerLoss,\n        input.maxLegs,\n        input.targetLegs,",
              1)
          replace('src/server/db/competition-leagues.ts',
              "      before.matches_per_pair !== input.matchesPerPair ||\n      before.points_per_win !== input.pointsPerWin ||\n      before.target_legs !== input.targetLegs ||",
              "      before.matches_per_pair !== input.matchesPerPair ||\n      before.max_legs !== input.maxLegs ||\n      before.points_per_win !== input.pointsPerWin ||\n      before.points_per_draw !== input.pointsPerDraw ||\n      before.points_per_loss !== input.pointsPerLoss ||\n      before.target_legs !== input.targetLegs ||")
          replace('src/server/db/competition-leagues.ts',
              "          name = ?, slug = ?, points_per_win = ?, target_legs = ?, max_players = ?, matches_per_pair = ?,\n          visibility = ?, hierarchy_position = ?, promotion_places = ?, relegation_places = ?, updated_at = ?",
              "          name = ?, slug = ?, points_per_win = ?, points_per_draw = ?, points_per_loss = ?, max_legs = ?, target_legs = ?, max_players = ?, matches_per_pair = ?,\n          visibility = ?, hierarchy_position = ?, promotion_places = ?, relegation_places = ?, updated_at = ?")
          replace('src/server/db/competition-leagues.ts',
              "        input.name,\n        input.slug,\n        input.pointsPerWin,\n        input.targetLegs,\n        input.maxPlayers,",
              "        input.name,\n        input.slug,\n        input.pointsPerWin,\n        input.pointsPerDraw,\n        input.pointsPerLoss,\n        input.maxLegs,\n        input.targetLegs,\n        input.maxPlayers,",
              1)

          # Structural season cloning copies the authoritative rules, not a reconstructed approximation.
          replace('src/server/db/season-lifecycle.ts',
              "      matchesPerPair: sourceLeague.matches_per_pair,\n      pointsPerWin: sourceLeague.points_per_win,\n      targetLegs: sourceLeague.target_legs,",
              "      matchesPerPair: sourceLeague.matches_per_pair,\n      maxLegs: sourceLeague.max_legs,\n      pointsPerWin: sourceLeague.points_per_win,\n      pointsPerDraw: sourceLeague.points_per_draw,\n      pointsPerLoss: sourceLeague.points_per_loss,\n      targetLegs: sourceLeague.target_legs,")

          # One persistence adapter keeps legacy rows/test fixtures compatible while max_legs is authoritative after migration.
          Path('src/server/db/scoring-rules.ts').write_text("""import { maxLegsFromLegacyTarget, type LeagueScoringRules } from '../domain/scoring';

export interface PersistedLeagueScoring {
  target_legs: number;
  max_legs?: number | null;
  points_per_win: number;
  points_per_draw?: number | null;
  points_per_loss?: number | null;
}

export function scoringRulesForLeague(league: PersistedLeagueScoring): LeagueScoringRules {
  return {
    maxLegs: Number.isInteger(league.max_legs) ? Number(league.max_legs) : maxLegsFromLegacyTarget(league.target_legs),
    pointsPerWin: Number(league.points_per_win),
    pointsPerDraw: Number(league.points_per_draw ?? 0),
    pointsPerLoss: Number(league.points_per_loss ?? 0),
  };
}
""")

          # Fixture-backed results validate against the authoritative Best-of contract.
          replace('src/server/db/fixture-results.ts',
              "import { getMembership } from './leagues';",
              "import { getMembership } from './leagues';\nimport { scoringRulesForLeague } from './scoring-rules';")
          replace('src/server/db/fixture-results.ts',
              "function resultFromFixtureInput(fixture: FixtureRecord, input: unknown, targetLegs: number): ResultInput {",
              "function resultFromFixtureInput(fixture: FixtureRecord, input: unknown, rules: ReturnType<typeof scoringRulesForLeague>): ResultInput {")
          replace('src/server/db/fixture-results.ts',
              "  }, targetLegs);",
              "  }, rules);")
          replace('src/server/db/fixture-results.ts',
              "  const result = resultFromFixtureInput(fixture, input, league.target_legs);",
              "  const result = resultFromFixtureInput(fixture, input, scoringRulesForLeague(league));",
              2)

          # Legacy/free-form result paths use the same league scoring contract.
          replace('src/server/db/results.ts',
              "import { getLeagueById, getMembership, listLeagueMembers } from './leagues';",
              "import { getLeagueById, getMembership, listLeagueMembers } from './leagues';\nimport { scoringRulesForLeague } from './scoring-rules';")
          replace('src/server/db/results.ts',
              "async function validateAndNormalize(input: unknown, targetLegs: number): Promise<ResultInput> {\n  const validation = validatePlayerResult(input, targetLegs);",
              "async function validateAndNormalize(input: unknown, rules: ReturnType<typeof scoringRulesForLeague>): Promise<ResultInput> {\n  const validation = validatePlayerResult(input, rules);")
          replace('src/server/db/results.ts',
              "validateAndNormalize(input, league.target_legs)",
              "validateAndNormalize(input, scoringRulesForLeague(league))",
              3)

          # Legacy league CRUD persists and returns the new fields too.
          replace('src/server/db/leagues.ts',
              "  points_per_win: number;\n  target_legs: number;",
              "  max_legs: number;\n  points_per_win: number;\n  points_per_draw: number;\n  points_per_loss: number;\n  target_legs: number;")
          replace('src/server/db/leagues.ts',
              "status, points_per_win, target_legs,",
              "status, max_legs, points_per_win, points_per_draw, points_per_loss, target_legs,",
              4)
          replace('src/server/db/leagues.ts',
              "leagues.points_per_win, leagues.target_legs,",
              "leagues.max_legs, leagues.points_per_win, leagues.points_per_draw, leagues.points_per_loss, leagues.target_legs,")
          replace('src/server/db/leagues.ts',
              "`INSERT INTO leagues (id, name, slug, season_name, status, points_per_win, target_legs,\n                          created_at, updated_at, created_by, max_players, matches_per_pair, visibility)\n     VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`",
              "`INSERT INTO leagues (id, name, slug, season_name, status, points_per_win, points_per_draw, points_per_loss, max_legs, target_legs,\n                          created_at, updated_at, created_by, max_players, matches_per_pair, visibility)\n     VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`")
          replace('src/server/db/leagues.ts',
              ").bind(id, input.name, input.slug, input.seasonName, input.status, input.pointsPerWin, input.targetLegs, timestamp, timestamp, actorUserId, input.maxPlayers, input.matchesPerPair, input.visibility).run();",
              ").bind(id, input.name, input.slug, input.seasonName, input.status, input.pointsPerWin, input.pointsPerDraw, input.pointsPerLoss, input.maxLegs, input.targetLegs, timestamp, timestamp, actorUserId, input.maxPlayers, input.matchesPerPair, input.visibility).run();")
          replace('src/server/db/leagues.ts',
              "    const scoringRulesChanged =\n      before.points_per_win !== input.pointsPerWin ||\n      before.target_legs !== input.targetLegs ||\n      before.matches_per_pair !== input.matchesPerPair;",
              "    const scoringRulesChanged =\n      (before.max_legs ?? ((before.target_legs * 2) - 1)) !== input.maxLegs ||\n      before.points_per_win !== input.pointsPerWin ||\n      (before.points_per_draw ?? 0) !== input.pointsPerDraw ||\n      (before.points_per_loss ?? 0) !== input.pointsPerLoss ||\n      before.target_legs !== input.targetLegs ||\n      before.matches_per_pair !== input.matchesPerPair;")
          replace('src/server/db/leagues.ts',
              "        SET name = ?, slug = ?, season_name = ?, status = ?, points_per_win = ?, target_legs = ?,\n            max_players = ?, matches_per_pair = ?, visibility = ?, updated_at = ?",
              "        SET name = ?, slug = ?, season_name = ?, status = ?, points_per_win = ?, points_per_draw = ?, points_per_loss = ?, max_legs = ?, target_legs = ?,\n            max_players = ?, matches_per_pair = ?, visibility = ?, updated_at = ?")
          replace('src/server/db/leagues.ts',
              ").bind(input.name, input.slug, input.seasonName, input.status, input.pointsPerWin, input.targetLegs, input.maxPlayers, input.matchesPerPair, input.visibility, timestamp, leagueId, leagueId, input.maxPlayers).run();",
              ").bind(input.name, input.slug, input.seasonName, input.status, input.pointsPerWin, input.pointsPerDraw, input.pointsPerLoss, input.maxLegs, input.targetLegs, input.maxPlayers, input.matchesPerPair, input.visibility, timestamp, leagueId, leagueId, input.maxPlayers).run();")

          # Public and legacy-admin JSON contracts expose Best-of plus W/D/L scoring.
          replace('src/server/routes/leagues.ts',
              "    pointsPerWin: league.points_per_win,\n    targetLegs: league.target_legs,",
              "    maxLegs: league.max_legs ?? ((league.target_legs * 2) - 1),\n    pointsPerWin: league.points_per_win,\n    pointsPerDraw: league.points_per_draw ?? 0,\n    pointsPerLoss: league.points_per_loss ?? 0,\n    targetLegs: league.target_legs,")
          replace('src/server/routes/admin-leagues.ts',
              "    pointsPerWin: league.points_per_win,\n    targetLegs: league.target_legs,",
              "    maxLegs: league.max_legs ?? ((league.target_legs * 2) - 1),\n    pointsPerWin: league.points_per_win,\n    pointsPerDraw: league.points_per_draw ?? 0,\n    pointsPerLoss: league.points_per_loss ?? 0,\n    targetLegs: league.target_legs,")
          replace('src/server/routes/admin-leagues.ts',
              "      pointsPerWin: body?.pointsPerWin ?? current.points_per_win,\n      targetLegs: body?.targetLegs ?? current.target_legs,",
              "      maxLegs: body?.maxLegs ?? (body?.targetLegs === undefined ? current.max_legs : undefined),\n      pointsPerWin: body?.pointsPerWin ?? current.points_per_win,\n      pointsPerDraw: body?.pointsPerDraw ?? current.points_per_draw,\n      pointsPerLoss: body?.pointsPerLoss ?? current.points_per_loss,\n      targetLegs: body?.targetLegs ?? current.target_legs,")
          replace('src/server/routes/competition.ts',
              "      matchesPerPair: body?.matchesPerPair ?? current.matches_per_pair,\n      pointsPerWin: body?.pointsPerWin ?? current.points_per_win,\n      targetLegs: body?.targetLegs ?? current.target_legs,",
              "      matchesPerPair: body?.matchesPerPair ?? current.matches_per_pair,\n      maxLegs: body?.maxLegs ?? (body?.targetLegs === undefined ? current.max_legs : undefined),\n      pointsPerWin: body?.pointsPerWin ?? current.points_per_win,\n      pointsPerDraw: body?.pointsPerDraw ?? current.points_per_draw,\n      pointsPerLoss: body?.pointsPerLoss ?? current.points_per_loss,\n      targetLegs: body?.targetLegs ?? current.target_legs,")

          # Update old in-memory DB fakes to model migration 0005 rather than misreading the new bind order.
          replace('tests/server/competition-routes.test.ts',
              "  points_per_win: number; target_legs: number; created_at: string; updated_at: string; created_by: string | null;",
              "  max_legs: number; points_per_win: number; points_per_draw: number; points_per_loss: number; target_legs: number; created_at: string; updated_at: string; created_by: string | null;")
          replace('tests/server/competition-routes.test.ts',
              "      const [id, name, slug, seasonName, seasonId, status, points, legs, createdAt, updatedAt, createdBy, maxPlayers, repeats, visibility, hierarchy, promotion, relegation] = values as [string, string, string, string, string, 'OPEN' | 'CLOSED', number, number, string, string, string, number, number, 'PUBLIC' | 'PRIVATE', number, number, number];\n      this.leagues.set(id, { id, name, slug, season_name: seasonName, season_id: seasonId, status, points_per_win: points, target_legs: legs, created_at: createdAt, updated_at: updatedAt, created_by: createdBy, max_players: maxPlayers, matches_per_pair: repeats, visibility, hierarchy_position: hierarchy, promotion_places: promotion, relegation_places: relegation });",
              "      const [id, name, slug, seasonName, seasonId, status, win, draw, loss, maxLegs, targetLegs, createdAt, updatedAt, createdBy, maxPlayers, repeats, visibility, hierarchy, promotion, relegation] = values as [string, string, string, string, string, 'OPEN' | 'CLOSED', number, number, number, number, number, string, string, string, number, number, 'PUBLIC' | 'PRIVATE', number, number, number];\n      this.leagues.set(id, { id, name, slug, season_name: seasonName, season_id: seasonId, status, max_legs: maxLegs, points_per_win: win, points_per_draw: draw, points_per_loss: loss, target_legs: targetLegs, created_at: createdAt, updated_at: updatedAt, created_by: createdBy, max_players: maxPlayers, matches_per_pair: repeats, visibility, hierarchy_position: hierarchy, promotion_places: promotion, relegation_places: relegation });")
          replace('tests/server/competition-routes.test.ts',
              "      const [name, slug, points, legs, maxPlayers, repeats, visibility, hierarchy, promotion, relegation, updatedAt, id] = values as [string, string, number, number, number, number, 'PUBLIC' | 'PRIVATE', number, number, number, string, string];\n      const league = this.leagues.get(id)!;\n      Object.assign(league, { name, slug, points_per_win: points, target_legs: legs, max_players: maxPlayers, matches_per_pair: repeats, visibility, hierarchy_position: hierarchy, promotion_places: promotion, relegation_places: relegation, updated_at: updatedAt });",
              "      const [name, slug, win, draw, loss, maxLegs, targetLegs, maxPlayers, repeats, visibility, hierarchy, promotion, relegation, updatedAt, id] = values as [string, string, number, number, number, number, number, number, number, 'PUBLIC' | 'PRIVATE', number, number, number, string, string];\n      const league = this.leagues.get(id)!;\n      Object.assign(league, { name, slug, max_legs: maxLegs, points_per_win: win, points_per_draw: draw, points_per_loss: loss, target_legs: targetLegs, max_players: maxPlayers, matches_per_pair: repeats, visibility, hierarchy_position: hierarchy, promotion_places: promotion, relegation_places: relegation, updated_at: updatedAt });")

          replace('tests/release/story-admin-league-structure.test.ts',
              "  points_per_win: number; target_legs: number; created_at: string; updated_at: string; created_by: string | null;",
              "  max_legs: number; points_per_win: number; points_per_draw: number; points_per_loss: number; target_legs: number; created_at: string; updated_at: string; created_by: string | null;")
          replace('tests/release/story-admin-league-structure.test.ts',
              "      const [id, name, slug, seasonName, seasonId, status, points, legs, createdAt, updatedAt, createdBy, maxPlayers, repeats, visibility, hierarchy, promotion, relegation] = values as [string, string, string, string, string, League['status'], number, number, string, string, string, number, number, League['visibility'], number, number, number];\n      this.leagues.set(id, { id, name, slug, season_name: seasonName, season_id: seasonId, status, points_per_win: points, target_legs: legs, created_at: createdAt, updated_at: updatedAt, created_by: createdBy, max_players: maxPlayers, matches_per_pair: repeats, visibility, hierarchy_position: hierarchy, promotion_places: promotion, relegation_places: relegation });",
              "      const [id, name, slug, seasonName, seasonId, status, win, draw, loss, maxLegs, targetLegs, createdAt, updatedAt, createdBy, maxPlayers, repeats, visibility, hierarchy, promotion, relegation] = values as [string, string, string, string, string, League['status'], number, number, number, number, number, string, string, string, number, number, League['visibility'], number, number, number];\n      this.leagues.set(id, { id, name, slug, season_name: seasonName, season_id: seasonId, status, max_legs: maxLegs, points_per_win: win, points_per_draw: draw, points_per_loss: loss, target_legs: targetLegs, created_at: createdAt, updated_at: updatedAt, created_by: createdBy, max_players: maxPlayers, matches_per_pair: repeats, visibility, hierarchy_position: hierarchy, promotion_places: promotion, relegation_places: relegation });")
          replace('tests/release/story-admin-league-structure.test.ts',
              "      const [name, slug, points, legs, maxPlayers, repeats, visibility, hierarchy, promotion, relegation, updatedAt, id] = values as [string, string, number, number, number, number, League['visibility'], number, number, number, string, string];\n      const league = this.leagues.get(id)!;\n      Object.assign(league, { name, slug, points_per_win: points, target_legs: legs, max_players: maxPlayers, matches_per_pair: repeats, visibility, hierarchy_position: hierarchy, promotion_places: promotion, relegation_places: relegation, updated_at: updatedAt });",
              "      const [name, slug, win, draw, loss, maxLegs, targetLegs, maxPlayers, repeats, visibility, hierarchy, promotion, relegation, updatedAt, id] = values as [string, string, number, number, number, number, number, number, number, League['visibility'], number, number, number, string, string];\n      const league = this.leagues.get(id)!;\n      Object.assign(league, { name, slug, max_legs: maxLegs, points_per_win: win, points_per_draw: draw, points_per_loss: loss, target_legs: targetLegs, max_players: maxPlayers, matches_per_pair: repeats, visibility, hierarchy_position: hierarchy, promotion_places: promotion, relegation_places: relegation, updated_at: updatedAt });")

          replace('tests/server/league-routes.test.ts',
              "  points_per_win: number;\n  target_legs: number;",
              "  max_legs: number;\n  points_per_win: number;\n  points_per_draw: number;\n  points_per_loss: number;\n  target_legs: number;")
          replace('tests/server/league-routes.test.ts',
              "      const [id, name, slug, seasonName, status, pointsPerWin, targetLegs, createdAt, updatedAt, createdBy, maxPlayers, matchesPerPair, visibility] = values as [string, string, string, string, 'OPEN' | 'CLOSED', number, number, string, string, string, number, number, 'PUBLIC' | 'PRIVATE'];\n      this.leagues.set(id, { id, name, slug, season_name: seasonName, status, points_per_win: pointsPerWin, target_legs: targetLegs, created_at: createdAt, updated_at: updatedAt, created_by: createdBy, max_players: maxPlayers, matches_per_pair: matchesPerPair, visibility: visibility ?? 'PUBLIC' });",
              "      const [id, name, slug, seasonName, status, win, draw, loss, maxLegs, targetLegs, createdAt, updatedAt, createdBy, maxPlayers, matchesPerPair, visibility] = values as [string, string, string, string, 'OPEN' | 'CLOSED', number, number, number, number, number, string, string, string, number, number, 'PUBLIC' | 'PRIVATE'];\n      this.leagues.set(id, { id, name, slug, season_name: seasonName, status, max_legs: maxLegs, points_per_win: win, points_per_draw: draw, points_per_loss: loss, target_legs: targetLegs, created_at: createdAt, updated_at: updatedAt, created_by: createdBy, max_players: maxPlayers, matches_per_pair: matchesPerPair, visibility: visibility ?? 'PUBLIC' });")
          replace('tests/server/league-routes.test.ts',
              "      const [name, slug, seasonName, status, pointsPerWin, targetLegs, maxPlayers, matchesPerPair, visibility, updatedAt, id] = values as [string, string, string, 'OPEN' | 'CLOSED', number, number, number, number, 'PUBLIC' | 'PRIVATE', string, string];\n      if (sql.includes('SELECT COUNT(*) FROM league_players')) {\n        const activeCount = [...this.memberships].filter((key) => key.startsWith(`${String(values[11])}:`)).length;\n        if (activeCount > Number(values[6])) return { success: true, meta: { changes: 0 } };\n      }\n      const league = this.leagues.get(id)!;\n      Object.assign(league, { name, slug, season_name: seasonName, status, points_per_win: pointsPerWin, target_legs: targetLegs, max_players: maxPlayers, matches_per_pair: matchesPerPair, visibility: visibility ?? 'PUBLIC', updated_at: updatedAt });",
              "      const [name, slug, seasonName, status, win, draw, loss, maxLegs, targetLegs, maxPlayers, matchesPerPair, visibility, updatedAt, id] = values as [string, string, string, 'OPEN' | 'CLOSED', number, number, number, number, number, number, number, 'PUBLIC' | 'PRIVATE', string, string];\n      if (sql.includes('SELECT COUNT(*) FROM league_players')) {\n        const activeCount = [...this.memberships].filter((key) => key.startsWith(`${String(values[14])}:`)).length;\n        if (activeCount > Number(values[15])) return { success: true, meta: { changes: 0 } };\n      }\n      const league = this.leagues.get(id)!;\n      Object.assign(league, { name, slug, season_name: seasonName, status, max_legs: maxLegs, points_per_win: win, points_per_draw: draw, points_per_loss: loss, target_legs: targetLegs, max_players: maxPlayers, matches_per_pair: matchesPerPair, visibility: visibility ?? 'PUBLIC', updated_at: updatedAt });")

          # Remove this transient workflow so no delivery infrastructure is left behind.
          Path('.github/workflows/task4-agent-patch.yml').unlink()
          PY
      - name: Commit patched implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes produced"; exit 1; }
          git commit -m "feat: persist configurable scoring rules"
          git push origin HEAD:feat/configurable-match-scoring
