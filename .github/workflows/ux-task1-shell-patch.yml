name: One-shot UX Task 1 shell patch

on:
  push:
    branches:
      - spec/ux-compression
    paths:
      - .ux-task1-shell-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec/ux-compression
      - name: Remove redundant signed-in account heading
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/client/App.tsx')
          text = path.read_text()
          old = '''            <div className="account-heading">
              <div>
                <p className="account-name">{user.username ?? 'Player'}</p>
                <p className="account-role">{user.role === 'ADMIN' ? 'Club administrator' : 'Misfits 501 player'}</p>
              </div>
              <span className="account-status">{myLeagues.length} {myLeagues.length === 1 ? 'season' : 'seasons'}</span>
            </div>
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one account heading block, found {text.count(old)}')
          path.write_text(text.replace(old, ''))
          PY
      - name: Remove one-shot patch machinery
        run: rm -f .ux-task1-shell-trigger .github/workflows/ux-task1-shell-patch.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: compress signed-in player shell"
          git push origin HEAD:spec/ux-compression
