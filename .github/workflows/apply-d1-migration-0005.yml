name: Apply production D1 migration 0005

on:
  push:
    branches:
      - feat/configurable-match-scoring
    paths:
      - .github/workflows/apply-d1-migration-0005.yml

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
      - name: Show unapplied migrations before change
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: "1"
        run: npx wrangler d1 migrations list DB --remote | tee /tmp/d1-before.txt
      - name: Apply production migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: "1"
        run: npx wrangler d1 migrations apply DB --remote | tee /tmp/d1-apply.txt
      - name: Verify migration 0005 is no longer pending
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: "1"
        run: |
          npx wrangler d1 migrations list DB --remote | tee /tmp/d1-after.txt
          if grep -q '0005_configurable_match_scoring.sql' /tmp/d1-after.txt; then
            echo '::error::Migration 0005 is still pending after apply'
            exit 1
          fi
          npx wrangler d1 execute DB --remote --command 'SELECT max_legs, points_per_draw, points_per_loss FROM leagues LIMIT 0;' | tee /tmp/d1-schema.txt
      - name: Record verified migration evidence
        run: |
          mkdir -p docs/operations/evidence
          {
            echo '# Production D1 migration 0005 evidence'
            echo
            echo "- UTC recorded: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Workflow run: $GITHUB_RUN_ID"
            echo "- Source commit: $GITHUB_SHA"
            echo '- Database binding: `DB` (`misfits`)'
            echo '- Migration: `0005_configurable_match_scoring.sql`'
            echo
            echo '## Unapplied migrations before apply'
            echo '```text'
            cat /tmp/d1-before.txt
            echo '```'
            echo
            echo '## Apply output'
            echo '```text'
            cat /tmp/d1-apply.txt
            echo '```'
            echo
            echo '## Unapplied migrations after apply'
            echo '```text'
            cat /tmp/d1-after.txt
            echo '```'
            echo
            echo '## Schema probe'
            echo '```text'
            cat /tmp/d1-schema.txt
            echo '```'
          } > docs/operations/evidence/2026-08-22-d1-migration-0005.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/operations/evidence/2026-08-22-d1-migration-0005.md
          git commit -m 'docs: record production D1 migration 0005'
          git push
