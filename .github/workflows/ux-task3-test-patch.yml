name: One-shot UX Task 3 test patch

on:
  push:
    branches: [spec/ux-compression]
    paths: [.ux-task3-test-trigger]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec/ux-compression
      - name: Align legacy Results assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/client/admin-competition.test.tsx')
          text = path.read_text()
          old = "    expect(await screen.findByText(/Alpha 3 - 1 Bravo/)).toBeTruthy();"
          new = "    expect(await screen.findByRole('heading', { name: 'Enter official fixture result' })).toBeTruthy();"
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale Results assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Remove one-shot machinery
        run: rm -f .ux-task3-test-trigger .github/workflows/ux-task3-test-patch.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align unified Results expectations"
          git push origin HEAD:spec/ux-compression
